name: TEMPORARY Groq credential probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe six agents and fetch candles
        env:
          BASE_URL: https://marketlens-pi.vercel.app
        run: |
          set -euo pipefail
          echo "== diagnostics before =="
          curl -sS --max-time 60 "$BASE_URL/api/diagnostics" -o before.json
          python3 - <<'PY'
          import json
          d=json.load(open("before.json"))
          print(json.dumps({"credentials": d.get("ai",{}).get("credentials"), "usage": d.get("ai",{}).get("usage")}, indent=2))
          PY
          echo "== probe =="
          code=$(curl -sS --max-time 120 -o probe.json -w '%{http_code}' -X POST "$BASE_URL/api/agent-probe" -H 'content-type: application/json' -d '{}')
          echo "HTTP $code"
          python3 -m json.tool probe.json || cat probe.json
          echo "== history =="
          hcode=$(curl -sS --max-time 60 -o history.json -w '%{http_code}' "$BASE_URL/api/history?symbol=TCS&exchange=NSE&interval=1day&limit=120")
          echo "HTTP $hcode"
          python3 - <<'PY'
          import json
          try:
              d=json.load(open("history.json"))
          except Exception:
              d={"raw":open("history.json").read()[:500]}
          if d.get("candles") is not None:
              print(json.dumps({"instrumentId":d.get("instrumentId"),"source":d.get("source"),"candles":len(d.get("candles") or []),"droppedRows":d.get("droppedRows"),"coverage":d.get("coverage"),"cached":d.get("cached")}, indent=2))
          else:
              print(json.dumps(d, indent=2)[:2000])
          PY
          echo "== diagnostics after =="
          curl -sS --max-time 60 "$BASE_URL/api/diagnostics" -o after.json
          python3 - <<'PY'
          import json
          d=json.load(open("after.json"))
          print(json.dumps({"usage": d.get("ai",{}).get("usage"), "agents": {k:{"env":v.get("credential",{}).get("envName"),"mode":v.get("credential",{}).get("mode"),"usage":v.get("usage")} for k,v in (d.get("ai",{}).get("agents") or {}).items()}, "market": d.get("market",{}).get("requestStates")}, indent=2))
          PY
          test "$code" = "200"
      - name: Publish result to a temporary ntfy topic
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          def load(path):
              try:
                  return json.load(open(path))
              except Exception as exc:
                  return {"error": str(exc)}
          before = load("before.json")
          probe = load("probe.json")
          history = load("history.json")
          after = load("after.json")
          lines = [f"### Production Groq credential probe", f"Run: {os.environ['RUN_URL']}", ""]
          if probe.get("agents"):
              lines += ["| agent | credential env | mode | status | requests | tokens | HTTP | error |", "| --- | --- | --- | --- | ---: | ---: | ---: | --- |"]
              for agent, run in probe["agents"].items():
                  lines.append("| {agent} | `{env}` | {mode} | {status} | {req} | {tok} | {http} | {err} |".format(
                      agent=agent, env=run.get("credentialEnvName"), mode=run.get("credentialMode"),
                      status=run.get("status"), req=run.get("requestCount"), tok=(run.get("usage") or {}).get("totalTokens"),
                      http=run.get("httpStatus"), err=(run.get("error") or "").replace("|", "\|")[:180]))
          else:
              lines += ["Probe response:", "```json", json.dumps(probe, indent=2)[:6000], "```"]
          lines += ["", "**Before usage:** `{}`".format(json.dumps((before.get("ai") or {}).get("usage"))), "**After usage:** `{}`".format(json.dumps((after.get("ai") or {}).get("usage")))]
          if history.get("candles") is not None:
              lines += ["", "**History:** `{}`".format(json.dumps({"instrumentId": history.get("instrumentId"), "source": history.get("source"), "candles": len(history.get("candles") or []), "droppedRows": history.get("droppedRows"), "coverage": history.get("coverage"), "cached": history.get("cached")}))]
          else:
              lines += ["", "**History error:** `{}`".format(json.dumps(history)[:1500])]
          open("result.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          test -s result.md
          curl -sS --max-time 30 -H "Title: MarketLens production probe" --data-binary @result.md "https://ntfy.sh/marketlens-probe-${GITHUB_SHA}" >/tmp/ntfy.out
          cat /tmp/ntfy.out
