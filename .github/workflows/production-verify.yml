name: Production verify (branch probe)
on:
  push:
    branches: [arena/aa9d3084-marketlens]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise production endpoints
        env:
          BASE: https://marketlens-pi.vercel.app
        run: |
          set -u
          out=production-verify.json
          echo '{' > "$out"
          echo '"generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> "$out"
          echo '"health":' >> "$out"
          curl -sS --max-time 60 "$BASE/api/health?v=probe-$(date +%s)" -o health.json || true
          cat health.json >> "$out"; echo ',' >> "$out"

          echo '"market":' >> "$out"
          curl -sS --max-time 60 "$BASE/api/market?symbol=TCS&exchange=NSE&v=probe-$(date +%s)" -o market.json || true
          cat market.json >> "$out"; echo ',' >> "$out"

          echo '"historyDaily":' >> "$out"
          curl -sS --max-time 60 "$BASE/api/history?symbol=TCS&exchange=NSE&interval=1day&limit=60&v=probe-$(date +%s)" -o daily.json || true
          cat daily.json >> "$out"; echo ',' >> "$out"

          echo '"history5m":' >> "$out"
          curl -sS --max-time 60 "$BASE/api/history?symbol=TCS&exchange=NSE&interval=5min&limit=60&v=probe-$(date +%s)" -o five.json || true
          cat five.json >> "$out"; echo ',' >> "$out"

          echo '"analysis":' >> "$out"
          curl -sS --max-time 60 "$BASE/api/analysis?symbol=TCS&exchange=NSE&interval=1day&limit=120&v=probe-$(date +%s)" -o analysis.json || true
          cat analysis.json >> "$out"; echo ',' >> "$out"

          echo '"researchCreate":' >> "$out"
          curl -sS --max-time 60 -X POST "$BASE/api/research" \
            -H 'content-type: application/json' -H 'x-owner-id: 0123456789abcdef0123456789abcdef0123456789abcdef' \
            -d '{"symbol":"TCS","depth":"quick"}' -o research.json || true
          cat research.json >> "$out"; echo ',' >> "$out"

          job_id=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("research.json","utf8")).jobId||"")}catch(e){console.log("")}')
          echo '"jobId":"'"$job_id"'",' >> "$out"
          echo '"jobDetail":' >> "$out"
          if [ -n "$job_id" ]; then
            sleep 5
            curl -sS --max-time 60 "$BASE/api/jobs/$job_id" -H 'x-owner-id: 0123456789abcdef0123456789abcdef0123456789abcdef' -o job.json || true
          else
            echo '{"error":"no job id"}' > job.json
          fi
          cat job.json >> "$out"; echo ',' >> "$out"

          echo '"providerStatus":' >> "$out"
          curl -sS --max-time 60 "$BASE/api/provider-status?v=probe-$(date +%s)" -o status.json || true
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("status.json","utf8"));console.log(JSON.stringify({storage:s.storage,queue:s.queue,marketObservations:s.marketObservations,instrumentCoverage:s.instrumentCoverage}))' >> "$out" 2>/dev/null || echo '{}' >> "$out"
          echo '}' >> "$out"

          node -e 'const fs=require("fs"); JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log("artifact JSON valid")' "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: production-verify
          path: production-verify.json
          retention-days: 3
